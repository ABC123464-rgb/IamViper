
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IamViper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #100b20;
      color: white;
      text-align: center;
    }

    header {
      padding: 55px 20px 35px;
      background: linear-gradient(135deg, #32105c, #160d2b);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(42px, 9vw, 68px);
      color: #c99aff;
    }

    header p {
      color: #ddd0f5;
      font-size: 17px;
    }

    .youtube {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 22px;
      background: #ff3155;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .tile {
      display: block;
      padding: 28px 15px;
      background: #211638;
      border: 1px solid #56367d;
      border-radius: 16px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: transform 0.2s, background 0.2s;
    }

    .tile:hover {
      background: #382153;
      transform: translateY(-3px);
    }

    .subtitle {
      color: #c7b7df;
      margin-bottom: 25px;
    }

    .gallery {
      display: none;
    }

    .gallery.active {
      display: block;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    .video {
      display: block;
      overflow: hidden;
      background: #211638;
      border: 1px solid #56367d;
      border-radius: 12px;
      color: white;
      text-decoration: none;
    }

    .video img {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #302342;
    }

    .video span {
      display: block;
      padding: 12px 8px;
      font-weight: bold;
    }

    .post {
      display: block;
      padding: 22px;
      background: #211638;
      border: 1px solid #56367d;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      text-align: left;
    }

    .back {
      margin: 0 0 25px;
      padding: 12px 20px;
      background: #56367d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    footer {
      padding: 30px 15px;
      color: #9f8ab8;
    }
  </style>
</head>

<body>
  <header>
    <h1>IamViper</h1>
    <p>Gaming • Edits • The Viper Squad</p>
    <a class="youtube"
       href="https://youtube.com/@iamviperlolxd">
      Open YouTube
    </a>
  </header>

  <main>
    <section id="home">
      <h2>Welcome to my world 🐍</h2>
      <p class="subtitle">Choose a section below.</p>

      <div class="menu">
        <button class="tile" data-open="gaming">
          🎮 Gaming
        </button>

        <button class="tile" data-open="edits">
          ✨ Edits
        </button>

        <button class="tile" data-open="squad">
          🐍 The Viper Squad
        </button>
      </div>
    </section>

    <section id="gaming" class="gallery">
      <button class="back" data-back>← Back home</button>
      <h2>🎮 Gaming</h2>
      <p class="subtitle">Gaming Shorts</p>
      <div class="video-grid" id="gaming-grid"></div>
    </section>

    <section id="edits" class="gallery">
      <button class="back" data-back>← Back home</button>
      <h2>✨ Edits</h2>
      <p class="subtitle">My edits</p>
      <div class="video-grid" id="edits-grid"></div>
    </section>

    <section id="squad" class="gallery">
      <button class="back" data-back>← Back home</button>
      <h2>🐍 The Viper Squad</h2>
      <p class="subtitle">Community posts</p>
      <div class="video-grid" id="posts-grid"></div>
    </section>
  </main>

  <footer>
    © IamViper • Thanks for visiting!
  </footer>

  <script>
    const gamingVideos = [
      ["iCDQdQyK7jE", "Gaming Short 2"],
      ["3VJZ23ChIUs", "Gaming Short 3"],
      ["9PIzTfMF9Io", "Gaming Short 4"],
      ["lZ2XuDWmpFA", "Gaming Short 6"],
      ["urmmvZ8p-uE", "Gaming Short 7"],
      ["dw-_r8D6x0Q", "Gaming Short 8"],
      ["idAoiEhp3Gc", "Gaming Short 9"]
    ];

    const editVideos = [
      ["wiQKghLDaHY", "Edit 1"],
      ["_gDdqN9GWLI", "Edit 5"]
    ];

    const communityPosts = [
      ["Ugkx5eqEpVYyNtmJErWkSZytQPwCW5P9HTcC", "Community Post 1"],
      ["UgkxtsIaJ-pwSk0o8tXF6rQxWMM_pVu__VF2", "Community Post 2"],
      ["UgkxIrI7gfLS38A0dzljkZhP14fL2yUw0un0", "Community Post 3"]
    ];

    function addVideos(containerId, videos) {
      const container = document.getElementById(containerId);

      videos.forEach(([id, title]) => {
        const link = document.createElement("a");
        link.className = "video";
        link.href = "https://youtube.com/shorts/" + id;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const img = document.createElement("img");
        img.src = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
        img.alt = title;
        img.loading = "lazy";

        const caption = document.createElement("span");
        caption.textContent = title;

        link.append(img, caption);
        container.appendChild(link);
      });
    }

    function addPosts() {
      const container = document.getElementById("posts-grid");

      communityPosts.forEach(([id, title]) => {
        const link = document.createElement("a");
        link.className = "post";
        link.href = "https://youtube.com/post/" + id;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "🐍 " + title + " — View post ↗";
        container.appendChild(link);
      });
    }

    function showSection(sectionId) {
      document.getElementById("home").style.display = "none";

      document.querySelectorAll(".gallery").forEach(section => {
        section.classList.remove("active");
      });

      document.getElementById(sectionId).classList.add("active");
      window.scrollTo(0, 0);
    }

    function showHome() {
      document.getElementById("home").style.display = "block";

      document.querySelectorAll(".gallery").forEach(section => {
        section.classList.remove("active");
      });

      window.scrollTo(0, 0);
    }

    document.querySelectorAll("[data-open]").forEach(button => {
      button.addEventListener("click", () => {
        showSection(button.dataset.open);
      });
    });

    document.querySelectorAll("[data-back]").forEach(button => {
      button.addEventListener("click", showHome);
    });

    addVideos("gaming-grid", gamingVideos);
    addVideos("edits-grid", editVideos);
    addPosts();
  </script>
</body>
</html>
